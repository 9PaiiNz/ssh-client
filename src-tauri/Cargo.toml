[package]
name = "ssh-client"
version = "0.1.2"
description = "A modern cross-platform SSH client"
authors = ["timle"]
edition = "2021"

[lib]
name = "ssh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
dashmap = "6"
async-trait = "0.1"
russh = "0.44"
russh-keys = "0.44"
russh-sftp = "2.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
bytes = "1"
dirs = "6"
