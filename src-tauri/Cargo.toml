[package]
name = "ssh-client"
version = "0.1.4"
description = "A modern cross-platform SSH client"
authors = ["timle"]
edition = "2021"

[lib]
name = "ssh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
dashmap = "6"
# ring instead of the default aws-lc-rs: builds on Windows MSVC without NASM/CMake.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
keyring-core = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
bytes = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
