name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libfuse2

      - run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SSH Client ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform:

            - **Windows:** `.exe` (NSIS installer)
            - **Linux:** `.AppImage` (make executable: `chmod +x *.AppImage`)

            Built from commit ${{ github.sha }}.
          releaseDraft: false
          prerelease: false

      # AppImage bundles stale libwayland from the CI image, which breaks EGL on
      # modern Wayland (grey window + EGL_BAD_PARAMETER). Strip them and re-upload.
      - name: Unbundle Wayland libs from AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          chmod +x scripts/appimage-unbundle-wayland.sh
          ./scripts/appimage-unbundle-wayland.sh

      - name: Re-upload patched AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for app in src-tauri/target/release/bundle/appimage/*.AppImage; do
            echo "Uploading $(basename "$app")"
            gh release upload "${{ github.ref_name }}" "$app" --clobber
          done
